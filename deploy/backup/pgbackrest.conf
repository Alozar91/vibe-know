# pgBackRest (этап 11, NFR-012): репозиторий — том backups, stanza kb
# (единый кластер PostgreSQL: БД kb + keycloak — HLD §8.2 «БД Keycloak в общий контур»).
[global]
repo1-type=posix
repo1-path=/backups/pgbackrest
# Полные копии: еженедельно по расписанию; retention 2 полных + WAL
repo1-retention-full=2
repo1-bundle=y
repo1-block=y
start-fast=y
delta=y
process-max=2
log-level-console=info
log-level-file=detail
compress-type=zst

[kb]
pg1-path=/var/lib/postgresql/18/docker
# Кластер инициализирован с POSTGRES_USER (не «postgres»); роль — superuser
pg1-user=kb
