# Развёртывание MVP «Корпоративная база знаний» (HLD §3.2, single-node).
# Версии ПО — строго по HLD §4. Параметры окружения — .env (образец .env.example); секреты — не в репозитории.
name: kb

# Ротация логов контейнеров (HLD §8.3: срок хранения и ротация — параметры окружения).
# Лимит на контейнер: LOG_MAX_SIZE × LOG_MAX_FILE (по умолчанию 10 МБ × 3 файла = 30 МБ).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILE:-3}"

services:
  postgres:
    # Этап 11 (NFR-012): образ с pgbackrest (PGDG) поверх postgres:18.6 —
    # archive_command вызывает pgbackrest archive-push (WAL → том backups),
    # pgbackrest.sh ведёт цикл базовых копий (полная вс / инкременты пн-сб).
    # pgbackrest требует локальное соединение с кластером → копии выполняются
    # здесь же (обёртка docker-entrypoint: postgres + pgbackrest.sh).
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: kb-pg-backup-tools:18.6
    container_name: kb-postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint:
      [
        "/bin/bash",
        "-c",
        # Фоновый цикл pgBackRest от postgres (pgBackRest запрещает root);
        # затем штатный entrypoint postgres (сам понижает права через gosu).
        # ВАЖНО: docker-ensure-initdb.sh — БЕЗ аргументов: аргументы уходят в
        # `postgres -C password_encryption` («true» → invalid argument → init
        # умирает до добавления «host all all all» в pg_hba.conf → Keycloak
        # не может подключиться; на стенде проявилось при первом старте).
        "docker-ensure-initdb.sh >/dev/null 2>&1; su postgres -s /bin/bash -c '/usr/local/bin/pgbackrest.sh' & exec docker-entrypoint.sh postgres -c archive_mode=on -c \"archive_command=test ! -f /backups/pgbackrest/wal/kb/%f && pgbackrest --stanza=kb archive-push %p\" -c archive_timeout=60s -c max_connections=250 -c plan_cache_mode=force_custom_plan",
      ]
    volumes:
      # PG18: монтируем /var/lib/pgdata postgres (данные в major-версионном подкаталоге,
      # см. docker-library/postgres#37) — совместимо с будущими pg_upgrade
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # WAL-архив (NFR-12): archive_command пишет сегменты в том backups
      - backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    # Штатный образ, start-dev: TLS/prod-режим Keycloak — этап 11 (тогда переход на
    # start --optimized); здоровье — mgmt-порт 9000 (внутренний).
    image: keycloak/keycloak:26.8.2-0
    container_name: kb-keycloak
    logging: *default-logging
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Hostname v2: issuer фиксирован (KB_PUBLIC_URL; локальный стенд —
      # http://localhost:8080). Строгий режим обязателен: при strict=false hostname
      # резолвится из Host-заголовка, и introspection через внутренний URL
      # (Host: keycloak:8080) даёт iss-несоответствие → active:false
      # (keycloak/keycloak#15694).
      # TLS за nginx (KB_PUBLIC_URL=https://домен): KC_HOSTNAME=https://домен/auth,
      # порт 8080 наружу не публикуется — схема README §5.
      KC_HOSTNAME: ${KC_HOSTNAME_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      # Переменные для подстановки ${VAR} в realm-kb-test.json при импорте.
      # KB_PUBLIC_URL (публичный адрес стенда, http://IP или https://домен) —
      # также KC_HOSTNAME_URL (см. ниже), issuer/CORS api/worker и build-arg SPA.
      # Не задан → пустая строка в JSON (записи «/*»/«» безвредны), localhost-дефолты.
      KB_API_CLIENT_SECRET: ${KB_API_CLIENT_SECRET}
      KB_CLI_CLIENT_SECRET: ${KB_CLI_CLIENT_SECRET}
      KB_TEST_PASSWORD: ${KB_TEST_PASSWORD}
      KB_PUBLIC_URL: ${KB_PUBLIC_URL:-}
      # PKCE-метод клиента kb-spa (политика realm): S256 в prod (HTTPS), plain
      # допустим только на http-стендах (crypto.subtle недоступен вне secure
      # context — SPA фолбэчится на plain, RFC 7636 §4.2). Локальный стенд на
      # localhost — secure context, SPA шлёт S256: дефолт S256.
      KB_PKCE_METHOD: ${KB_PKCE_METHOD:-S256}
      # Адрес Keycloak (issuer): https://домен → https://домен/auth (TLS за nginx,
      # порт 8080 наружу не публикуется); иначе http://…:8080 напрямую. См. .env.
      KC_HOSTNAME_URL: ${KC_HOSTNAME_URL:-http://localhost:8080}
    volumes:
      - ./keycloak/realm-kb-test.json:/opt/keycloak/data/import/realm-kb-test.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # В образе Keycloak нет curl; health на mgmt-порту 9000 (внутренний)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 120s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: kb-valkey
    logging: *default-logging
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - valkeydata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # CAS-хранилище (S3 API). Наружу не публикуется: браузеру silo недоступен (HLD §3.2);
  # доступ api/worker — по внутренней сети Compose.
  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: kb-silo
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      MINIO_BROWSER: "false"
    volumes:
      - silodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Однократное создание бакета CAS (клиент mc — от того же вендора, что silo)
  silo-init:
    image: pgsty/mc:latest
    container_name: kb-silo-init
    depends_on:
      silo:
        condition: service_healthy
    environment:
      SILO_ROOT_USER: ${SILO_ROOT_USER}
      SILO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      SILO_BUCKET: ${SILO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://silo:9000 $$SILO_ROOT_USER $$SILO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$SILO_BUCKET &&
      echo 'бакет CAS готов'"

  # Конвертер офисных форматов в PDF (HLD §3.2; подключается задачами этапа 6)
  gotenberg:
    image: gotenberg/gotenberg:9.2.0
    container_name: kb-gotenberg
    logging: *default-logging
    healthcheck:
      # В образе Gotenberg нет wget/curl и /bin/sh — dash без /dev/tcp; проба через python3? —
      # тоже нет. Простейший корректный способ: bash недоступен, поэтому проверяем TCP из busybox?
      # Надёжный вариант: временный контур проверяется Prometheus (HTTP-метрики этапа 11);
      # здесь — проверка процесса.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Зеркало PyPI для сборки (файлы pythonhosted недоступны с сервера —
        # таймауты CDN): пример https://pypi.tuna.tsinghua.edu.cn; пусто = PyPI
        UV_PYPI_MIRROR: ${UV_PYPI_MIRROR:-}
    container_name: kb-api
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      KB_DATABASE_URL: postgresql+psycopg://kb:${POSTGRES_PASSWORD}@postgres:5432/kb
      KB_REDIS_URL: redis://valkey:6379/0
      KB_S3_ENDPOINT: http://silo:9000
      KB_S3_BUCKET: ${SILO_BUCKET}
      KB_S3_ACCESS_KEY: ${SILO_ROOT_USER}
      KB_S3_SECRET_KEY: ${SILO_ROOT_PASSWORD}
      KB_GOTENBERG_URL: http://gotenberg:3000
      KB_OIDC_ISSUER: ${KC_HOSTNAME_URL:-http://localhost:8080}/realms/kb
      KB_OIDC_INTROSPECTION_URL: http://keycloak:8080/realms/kb/protocol/openid-connect/token/introspect
      KB_OIDC_CLIENT_ID: kb-api
      KB_OIDC_CLIENT_SECRET: ${KB_API_CLIENT_SECRET}
      # Публичный адрес SPA — для CORS (main.py: allow_origins) и ссылок в письмах
      KB_FRONTEND_URL: ${KB_PUBLIC_URL:-http://localhost}
      # Тестовая регистрация с выбором роли (НЕ для продуктива): задаётся только
      # на тестовом стенде; пусто/false — функция выключена
      KB_TEST_REGISTRATION: ${KB_TEST_REGISTRATION:-false}
      # MCP-сервер (RAG_DESIGN §8-5): read-only тулы kb_search/kb_groups на
      # /api/v1/mcp; аутентификация — Bearer Keycloak. По умолчанию включён.
      KB_MCP_ENABLED: ${KB_MCP_ENABLED:-true}
      KB_LOG_LEVEL: ${LOG_LEVEL}
    ports:
      # 8000 на хосте занят сторонним процессом — хост-маппинг 8001 (внутри сети — 8000)
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Фоновые задачи (Celery); обработчики задач — этапы 6, 9, 10
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        UV_PYPI_MIRROR: ${UV_PYPI_MIRROR:-}
    container_name: kb-worker
    command: ["python", "-m", "app.worker.main"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      silo:
        condition: service_healthy
    environment:
      KB_DATABASE_URL: postgresql+psycopg://kb:${POSTGRES_PASSWORD}@postgres:5432/kb
      KB_REDIS_URL: redis://valkey:6379/0
      KB_S3_ENDPOINT: http://silo:9000
      KB_S3_BUCKET: ${SILO_BUCKET}
      KB_S3_ACCESS_KEY: ${SILO_ROOT_USER}
      KB_S3_SECRET_KEY: ${SILO_ROOT_PASSWORD}
      KB_GOTENBERG_URL: http://gotenberg:3000
      KB_OIDC_ISSUER: ${KC_HOSTNAME_URL:-http://localhost:8080}/realms/kb
      KB_OIDC_INTROSPECTION_URL: http://keycloak:8080/realms/kb/protocol/openid-connect/token/introspect
      KB_OIDC_CLIENT_ID: kb-api
      KB_OIDC_CLIENT_SECRET: ${KB_API_CLIENT_SECRET}
      KB_LOG_LEVEL: ${LOG_LEVEL}
    # Экспозер метрик worker — порт 9808 (внутренняя сеть, LLD §9)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 9808), 2)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  # nginx: TLS-терминация (FR-149; TLS-сертификат — этап 11), статика SPA, прокси /api
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
      args:
        KB_PUBLIC_URL: ${KB_PUBLIC_URL:-}
        # База приложения (подпуть): /know/ → приложение на merch-vibe.ru/know
        VITE_APP_BASE: ${VITE_APP_BASE:-}
    container_name: kb-nginx
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS (README §5): ./nginx/certs/kb.crt + kb.key (Let's Encrypt для домена).
      # Нет сертификатов → entrypoint-скрипт создаёт self-signed placeholder.
      # ACME webroot для certbot renew без остановки nginx.
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/acme:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: kb-prometheus
    logging: *default-logging
    depends_on:
      - api
      - worker
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.0
    container_name: kb-postgres-exporter
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/kb?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: kb-node-exporter
    logging: *default-logging
    command:
      - "--path.rootfs=/host"
      # Свежесть бэкапов (NFR-019): textfile-файл от контейнера backup
      - "--collector.textfile.directory=/backups/prometheus"
    volumes:
      - /:/host:ro
      - backups:/backups:ro
    pid: "host"
    ports:
      - "9100:9100"
    restart: unless-stopped

  # Alertmanager: канал алертинга — email СА (NFR-019); SMTP настраивается при внедрении,
  # до этого алертинг отключён (US-040 A1) — заглушка с пустым приёмником.
  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: kb-alertmanager
    logging: *default-logging
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  # blackbox-exporter: HTTP/TCP-пробы сервисов без экспозера метрик (NFR-019,
  # HLD §8.3 «Доступность сервисов») — keycloak/converter/silo/nginx/valkey.
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    container_name: kb-blackbox
    logging: *default-logging
    restart: unless-stopped

  # Однократная подготовка тома backups (владелец — postgres uid 999): pgBackRest
  # (postgres-контейнер) и restic (контейнер backup) работают от postgres
  # (pgBackRest запрещает root).
  backup-init:
    # Тот же образ, что и postgres (собирается из ./backup) — секция build
    # обязательна: на свежем сервере compose иначе тянет образ из Docker Hub
    # раньше, чем его соберёт postgres (pull access denied).
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: kb-pg-backup-tools:18.6
    container_name: kb-backup-init
    user: root
    volumes:
      - backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      [
        "-c",
        "mkdir -p /backups/pgbackrest /backups/restic /backups/prometheus /backups/status && chown -R 999:999 /backups && echo backup-init: OK",
      ]
    restart: "no"

  # Бэкап-контур (этап 11, NFR-012, HLD §8.2): pgBackRest — WAL-архив (непрерывно,
  # RPO ≤ 1 ч) + базовые копии (полная еженедельно, инкременты ежедневно);
  # restic — снапшоты тома silo сразу после копии БД (согласование по времени —
  # единая точка восстановления). Stanza kb = весь кластер PG (БД kb + keycloak).
  # Свежесть копий — textfile-файл для node-exporter (алерты BackupStale/Failed).
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: kb-backup
    logging: *default-logging
    depends_on:
      backup-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD}
    volumes:
      # silo — только чтение (CAS-объекты неизменяемы, NFR-010)
      - silodata:/silo-data:ro
      - backups:/backups
    # Цикл: ожидание маркера pgBackRest → restic → textfile (backup.sh)
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  silodata:
  promdata:
  backups:
