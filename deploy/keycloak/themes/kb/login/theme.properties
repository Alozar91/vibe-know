parent=keycloak.v2
import=common/keycloak

# Светлая тема по умолчанию (в SPA тёмная включается вручную; login-страницы
# всегда в светлой палитре системы)
darkMode=false

# Оба стиля: каркасный CSS keycloak.v2 (раскладка карточки) + перекрытия.
# Свойство styles в дочерней теме ЗАМЕЩАЕТ родительский список —
# без keycloak-v2.css раскладка PatternFly-каркаса теряется (дефект «едет»).
styles=css/keycloak-v2.css css/styles.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

favicons=img/favicon.ico

locales=ru
