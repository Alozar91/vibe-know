worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Структурированный лог доступа (собирается Docker, HLD §8.3)
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"body_bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json_combined;

    # Лимит тела запроса = file_max_size_mb + запас на multipart-обрамление (FR-031; параметр — реестр 2.5 LLD)
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    upstream keycloak_upstream {
        server keycloak:8080;
    }

    server {
        listen 80;
        server_name _;

        # TLS-режим (KB_PUBLIC_URL=https://…): каталог для certbot (обновление сертификата)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Статика веб-клиента (SPA)
        root /usr/share/nginx/html;
        index index.html;

        # Приложение по подпути (/know) и в корне: base задаётся сборкой SPA
        # (VITE_APP_BASE), файлы лежат в dist/know/...
        location /know/ {
            alias /usr/share/nginx/html/know/;
            try_files $uri $uri/ /know/index.html;
        }
        location = /know {
            return 301 /know/;
        }

        # SPA-роутинг: всё, что не файл и не /api, — на index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # REST API (HLD §7: /api/v1)
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_body_buffer_size 1m;
        }

        # readyz api (готовность зависимостей) — проксирование; /healthz выше — свой ответ nginx
        location = /readyz {
            proxy_pass http://api_upstream/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # healthcheck самого nginx
        location = /healthz {
            access_log off;
            return 200 'ok';
        }
    }

    # HTTPS-блок: активен только при наличии сертификатов (TLS-схема README §5).
    # KB_PUBLIC_URL=https://домен → Keycloak для браузера по /auth (порт 8080 закрыт).
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/kb.crt;
        ssl_certificate_key /etc/nginx/certs/kb.key;

        # Статика SPA
        root /usr/share/nginx/html;
        index index.html;

        # Приложение по подпути (/know) и в корне (base задаётся сборкой SPA)
        location /know/ {
            alias /usr/share/nginx/html/know/;
            try_files $uri $uri/ /know/index.html;
        }
        location = /know {
            return 301 /know/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # REST API
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_body_buffer_size 1m;
        }

        # Keycloak за nginx: URI-часть «/» обязательна (отрезает префикс /auth)
        location /auth/ {
            proxy_pass http://keycloak_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
        }

        location = /readyz {
            proxy_pass http://api_upstream/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /healthz {
            access_log off;
            return 200 'ok';
        }
    }
}
