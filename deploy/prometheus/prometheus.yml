# Prometheus 3 (HLD §8.3): метрики api, worker, экспортеров; HTTP-пробы сервисов
# без экспозера (blackbox-exporter); правила алертинга — alerts.yml (NFR-019).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9808']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Свежесть бэкапов (NFR-019, HLD §8.3 «Бэкапы»): файл состояния в томе backups
  # пишет контейнер backup; читается textfile-коллектором node-exporter
  # (--collector.textfile.directory, см. command node-exporter в compose).
  # Метрики: kb_backup_freshness_seconds, kb_backup_failed (job="node").

  # HTTP-пробы сервисов без экспозера метрик — blackbox-exporter (NFR-019):
  # один контейнер blackbox, отдельный job на сервис (алерты — по job=).
  - job_name: keycloak
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://keycloak:8080/realms/kb
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: converter
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gotenberg:3000/health
    relabel_configs: *probe_relabel

  - job_name: silo
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://silo:9000/minio/health/live
    relabel_configs: *probe_relabel

  - job_name: nginx
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx/healthz
    relabel_configs: *probe_relabel

  # Valkey — не HTTP: TCP-проба (RESP отвечает на соединение)
  - job_name: valkey
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - valkey:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
