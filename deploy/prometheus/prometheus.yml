# Prometheus 3 (HLD §4): сбор метрик api, worker и экспортеров; алертинг — этап 11.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9808']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Доступность сервисов — через blackbox-подобные пробы добавляются на этапе 11 (HLD §8.3);
  # очереди/задачи — экспозер worker (LLD §9).
